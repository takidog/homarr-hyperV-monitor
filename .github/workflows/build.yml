name: Build Homarr with Hyper-V
on:
  push:
    branches: [main]
    paths: ['homarr/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble pinned upstream and extension
        run: python3 scripts/prepare.py
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .build/homarr
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/takidog/homarr-hyperv-monitor:latest
            ghcr.io/takidog/homarr-hyperv-monitor:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/takidog/homarr-hyperV-monitor
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Homarr 2.10.1 with native Hyper-V monitoring
          cache-from: type=gha
          cache-to: type=gha,mode=max
